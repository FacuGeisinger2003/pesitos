<style>
:root{
  --brand:#B3123E; --brand-d:#7C0A29; --brand-l:#E2365F; --blush:#FBE4E9; --blush2:#F7D0D9;
  --cream:#FFF7F0; --ink:#21121A; --ink2:#6B5560; --line:#EFE1E3; --gold:#F5B940; --gold-d:#C98A12;
  --green:#178A5E; --green-l:#DDF4EA; --card:#FFFFFF; --red:#C62828;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--cream);display:flex;align-items:center;justify-content:center;gap:80px;overflow:hidden;
 background-image:radial-gradient(circle at 85% 15%,var(--blush) 0,transparent 40%),radial-gradient(circle at 10% 90%,var(--blush) 0,transparent 35%)}
.h{font-family:'Bricolage Grotesque',sans-serif}
/* phone */
.phone{width:372px;height:780px;border-radius:56px;background:#1a1014;padding:11px;position:relative;
  box-shadow:0 40px 80px -30px rgba(124,10,41,.45),0 0 0 2px #3a2a30 inset;flex:none}
.scr{width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--cream);position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#1a1014;border-radius:20px;z-index:20}
.sb{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:700;font-size:14px;position:relative;z-index:5}
.sb .ic{display:flex;gap:5px;align-items:center}
.body{flex:1;padding:6px 20px 16px;overflow-y:auto;position:relative;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.tabs{height:78px;flex:none;border-top:1px solid var(--line);display:flex;background:#fff;padding-bottom:14px;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:#9d8a92}
.tab.on{color:var(--brand);font-weight:700}
.tab.mid{flex:none;width:64px}
.tab.mid span{width:52px;height:52px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 10px 20px -8px rgba(124,10,41,.6)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{font-family:'Bricolage Grotesque';font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:.9}
.logo .d{color:var(--gold-d)}
.pts{font-family:'Bricolage Grotesque';font-weight:800}
.card{background:var(--card);border-radius:20px;padding:14px 16px;border:1px solid var(--line)}
.row{display:flex;align-items:center}
.sp{flex:1}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.t1{font-family:'Bricolage Grotesque';font-weight:700;font-size:24px;letter-spacing:-.01em}
.t2{font-family:'Bricolage Grotesque';font-weight:700;font-size:16px}
.small{font-size:12.5px;color:var(--ink2)}
.btn{height:50px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;font-family:inherit}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.inp{height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 14px;font-size:14.5px;color:var(--ink2);gap:10px}
.inp:focus-within{border-color:var(--brand)}
.inp input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);flex:1;min-width:0;font-weight:500}
.inp input::placeholder{color:#b9a7ae;font-weight:400}
.big input{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px}
.bar{height:9px;border-radius:9px;background:var(--blush);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--brand);transition:width .4s}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:30px;font-size:12.5px;font-weight:500;border:1.5px solid var(--line);background:#fff;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.coin{width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-d);display:inline-flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:10px;color:#7a4f00;flex:none}
.plus{color:var(--green);font-family:'Bricolage Grotesque';font-weight:800}
.minus{color:var(--brand);font-family:'Bricolage Grotesque';font-weight:800}
.step{display:flex;gap:5px}.step i{height:5px;flex:1;border-radius:5px;background:var(--blush2)}.step i.on{background:var(--brand)}
.star{position:absolute;fill:var(--brand);pointer-events:none}
.tog{width:40px;height:24px;border-radius:24px;background:var(--brand);position:relative;flex:none;transition:background .2s}.tog:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.tog.off{background:#dccbd0}.tog.off:after{right:auto;left:3px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #d6c3c9;flex:none}.radio.on{border:6px solid var(--brand)}
.ibox{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--blush);color:var(--brand)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li .tt{font-weight:700;font-size:14.5px;line-height:1.2}
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg div{flex:1;text-align:center;padding:8px 4px;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg div.on{background:var(--brand);color:#fff}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.qa{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;text-align:center}
.qa .ibox{width:40px;height:40px}
[data-go],[data-act],.chip,.opt{cursor:pointer;-webkit-tap-highlight-color:transparent}
[data-go]:active,[data-act]:active,.btn:active{transform:scale(.97)}
.btn,.tab,.chip,[data-go]{transition:transform .12s,background .2s}
#phone.anim .body{animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:16px;right:16px;top:58px;z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:13px 16px;font-size:14px;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:in .3s ease;pointer-events:none}
.shade{position:absolute;inset:0;background:rgba(33,18,26,.45);z-index:35;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--cream);width:100%;border-radius:28px 28px 0 0;padding:22px 22px 30px;animation:up .25s ease;max-height:90%;overflow:auto;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.hl{position:relative;z-index:2;animation:pulse 1.4s ease-in-out infinite;border-radius:16px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,185,64,.0)}50%{box-shadow:0 0 0 5px rgba(245,185,64,.85)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.cal div.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cal div.td{outline:2px dashed var(--brand);outline-offset:1px}
.empty{text-align:center;padding:22px 10px;color:var(--ink2);font-size:13.5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:9px;border-radius:9px;background:var(--blush);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:pointer}
.x{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#b9a7ae}
/* side panel */
.side{width:430px;max-height:100vh;overflow:auto;padding:24px 0;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side .b{display:flex;align-items:center;gap:10px;margin-top:10px;padding:11px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14.5px;cursor:pointer;user-select:none}
.side .b:hover{border-color:var(--brand);color:var(--brand)}
.side .b.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.side .b.pri:hover{background:var(--brand-d);color:#fff}
.tour{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.tour div{display:flex;gap:12px;align-items:center;padding:6px 12px;border-radius:14px;cursor:pointer;font-size:15px;border:1.5px solid transparent;user-select:none}
.tour div:hover{background:#fff;border-color:var(--line)}
.tour div.cur{background:#fff;border-color:var(--brand)}
.tour b{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12.5px;background:var(--blush);color:var(--brand)}
.tour .ok b{background:var(--green);color:#fff}
.tour .ok span{color:var(--ink2)}
.dclock{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;border-radius:20px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.qr{margin-top:18px;display:flex;gap:16px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px}
.qr svg{width:110px;height:110px;flex:none}
@media (max-width:980px){.side{display:none}body{gap:0}}
@media (max-width:600px){
 body{display:block;background:var(--cream)}
 #wrap{position:fixed;inset:0}
 .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--cream)}
 .scr{border-radius:0;padding-top:env(safe-area-inset-top)}
 .notch,.sb{display:none}
 .body{padding-top:14px}
 .tabs{height:auto;min-height:64px;padding:8px 0 max(10px,env(safe-area-inset-bottom))}
 .toast{top:calc(env(safe-area-inset-top) + 10px)}
 .sheet{padding-bottom:max(30px,env(safe-area-inset-bottom))}
 #phone{zoom:1!important}
}
</style></head><body>

<script>

const DAY=864e5, KEY='pesitos-v2';

/* ---------- helpers ---------- */
const now=()=>Date.now()+((ST&&ST.offset)||0)*DAY;
const dk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const kDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const kAdd=(k,n)=>{const d=kDate(k);d.setDate(d.getDate()+n);return dk(d.getTime())};
const today=()=>dk(now());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>'$ '+Math.round(n).toLocaleString('es-UY');

const sameMonth=ts=>{const a=new Date(ts),b=new Date(now());return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()};
const fmtDay=ts=>{const s=new Date(ts).toLocaleDateString('es-UY',{weekday:'long',day:'numeric',month:'long'});return s[0].toUpperCase()+s.slice(1)};
const fmtShort=ts=>new Date(ts).toLocaleDateString('es-UY',{day:'numeric',month:'short'});
const fmtHour=ts=>new Date(ts).toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'});
const monthName=()=>new Date(now()).toLocaleDateString('es-UY',{month:'long'});
const daysInMonth=ts=>{const d=new Date(ts);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const ago=ts=>{const k=dk(ts),t=today();if(k===t)return 'hoy '+fmtHour(ts);if(k===kAdd(t,-1))return 'ayer';const n=Math.round((kDate(t)-kDate(k))/DAY);return n<7?'hace '+n+' días':fmtShort(ts)};
const initials=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'YO';
const firstName=n=>String(n).trim().split(/\s+/)[0]||'vos';

/* ---------- catálogos ---------- */

const catIco=c=>(CATS.find(x=>x[0]===c)||[0,'dots'])[1];
const REWARDS=[

/* ---------- cálculos ---------- */
const meName=()=>ST.user?firstName(ST.user.name):'Vos';
function monthExp(){return ST.expenses.filter(e=>sameMonth(e.ts))}
function spentMonth(){return monthExp().reduce((s,e)=>s+e.amt,0)}
function daySpend(k){return ST.expenses.filter(e=>dk(e.ts)===k).reduce((s,e)=>s+e.amt,0)}
function perDay(){const d=new Date(now()),left=daysInMonth(now())-d.getDate()+1;return Math.max(0,(ST.user.budget-spentMonth())/left)}
function logSet(){const s=new Set(ST.expenses.map(e=>dk(e.ts)));ST.nospend.forEach(k=>s.add(k));return s}
function loggedToday(){return logSet().has(today())}
function streakInfo(){const s=logSet();let k=today();if(!s.has(k))k=kAdd(k,-1);const end=k;let n=0;while(s.has(k)){n++;k=kAdd(k,-1)}return{n,start:kAdd(end,-(n-1)),alive:n>0,todayDone:s.has(today())}}
function budgetStreak(){let n=0,k=kAdd(today(),-1);const lim=()=>ST.user.budget/daysInMonth(kDate(k).getTime());while(k>=ST.since&&n<120){if(daySpend(k)<=lim())n++;else break;k=kAdd(k,-1)}return n}
const wkOf=k=>Math.floor((Date.UTC(...k.split('-').map((v,i)=>i===1?v-1:+v))/DAY+3)/7);
function saveStreak(){const w=new Set(ST.savings.map(s=>wkOf(dk(s.ts))));let c=wkOf(today());if(!w.has(c))c--;let n=0;while(w.has(c)){n++;c--}return n}
function savedMonth(){return ST.savings.filter(s=>sameMonth(s.ts)).reduce((a,s)=>a+s.amt,0)}
function saveGoal(){const u=ST.user;return Math.round((u.income||u.budget)*u.savePct/100)}
function weekPts(){const lim=now()-7*DAY;return ST.ledger.filter(x=>x.ts>=lim&&x.pts>0).reduce((s,x)=>s+x.pts,0)}
function monthPts(){return ST.ledger.filter(x=>x.pts>0&&sameMonth(x.ts)).reduce((s,x)=>s+x.pts,0)}
function totalPts(){return ST.ledger.filter(x=>x.pts>0).reduce((s,x)=>s+x.pts,0)}
function members(g){return g.members.map(m=>m.id==='me'?{id:'me',n:meName(),ini:initials(ST.user.name),c:'#B3123E',pts:monthPts(),me:true}:{id:m.id,n:BOTS[m.id][0],ini:BOTS[m.id][1],c:BOTS[m.id][2],pts:m.pts||0}).sort((a,b)=>b.pts-a.pts)}
function myRank(g){return members(g).findIndex(m=>m.me)+1}
function grp(id){return ST.groups.find(g=>g.id===id)}
function chProgress(){const c=ST.ch;if(!c)return null;const inR=ST.expenses.filter(e=>{const k=dk(e.ts);return k>=c.start&&k<=c.end});
 let fail=false,txt='';
 if(c.type==='nodeliv'){fail=inR.some(e=>e.cat==='Delivery');txt=fail?'Registraste un delivery':'Vas bien, seguí así'}
 if(c.type==='cafe3'){const n=inR.filter(e=>e.cat==='Café').length;fail=n>3;txt=`${Math.min(n,4)} de 3 cafés`}
 if(c.type==='reg5'){const s=logSet();let n=0;for(let k=c.start;k<=c.end;k=kAdd(k,1))if(s.has(k))n++;txt=`${n} de 5 días`;if(n>=5&&c.status==='on')return{win:true,txt}}
 const day=Math.min(7,Math.round((kDate(today())-kDate(c.start))/DAY)+1);return{fail,txt,day}}

/* ---------- acciones con puntos ---------- */
function earn(pts,t,sub,ic){if(!pts)return;ST.pts+=pts;ST.ledger.unshift({id:uid(),ts:now(),pts,t,sub,ic});if(pts>0)ST.groups.forEach(g=>g.pool+=pts)}
function notify(t){ST.notifs.unshift({id:uid(),ts:now(),t,read:false})}
let celebrateQ=[];
function checkStreak(){const s=streakInfo();ST.best=Math.max(ST.best||0,s.n);
 MILESTONES.forEach(([m,p])=>{const key='r'+m+'-'+s.start;if(s.n>=m&&!ST.awards.includes(key)){ST.awards.push(key);earn(p,`Racha de ${m} días`,'Registrando gastos','flame');celebrateQ.push({title:`¡Racha de ${m} días!`,sub:`Registraste tus gastos ${m} días seguidos.`,pts:p});ST.groups.forEach(g=>g.feed.unshift({ts:now(),t:`${meName()} llegó a ${m} días de racha`}))}})}
function checkChallenge(){const c=ST.ch,p=chProgress();if(c&&c.status==='on'&&p&&p.win){c.status='won';earn(c.pts,'Desafío cumplido',c.t,'target');celebrateQ.push({title:'¡Desafío cumplido!',sub:c.t,pts:c.pts})}}
function registerDay(){if(!ST.closed['reg-'+today()]){ST.closed['reg-'+today()]=1;earn(10,'Registraste tus gastos','Un día más en tu racha','pen');return 10}return 0}
function addExpense(amt,cat,note,dayOff=0){const ts=dayOff?kDate(kAdd(today(),dayOff)).getTime()+rnd(0,6)*36e5:now();
 ST.expenses.unshift({id:uid(),ts,amt,cat,note});ST.expenses.sort((a,b)=>b.ts-a.ts);
 const before=ST.pts;let got=0;if(dayOff===0)got=registerDay();checkStreak();checkChallenge();return ST.pts-before}
function afterGain(msg){if(celebrateQ.length){const c=celebrateQ.shift();ST.sheet={type:'celebrate',...c,msg}}else if(msg)toast(msg)}

/* ---------- pasar el tiempo (modo demo) ---------- */
function advanceDay(){
 const left=today();
 // cierre del día que termina
 if(ST.logged&&ST.user){
  const lim=ST.user.budget/daysInMonth(kDate(left).getTime());const sp=daySpend(left);
  if(logSet().has(left)&&sp<=lim&&!ST.closed['bud-'+left]){ST.closed['bud-'+left]=1;earn(5,'Día dentro del presupuesto',`Gastaste ${M(sp)} de ${M(lim)}`,'target')}
 }
 ST.offset+=1;
 ST.groups.forEach(g=>{let any=false;g.members.forEach(m=>{if(m.id==='me')return;if(Math.random()<.75){const p=rnd(5,30);m.pts=(m.pts||0)+p;g.pool+=p;any=true}});
  if(g.goal&&g.saved<g.goal&&Math.random()<.6){const ms=g.members.filter(m=>m.id!=='me');const m=ms[rnd(0,ms.length-1)];const a=rnd(2,10)*100;g.saved=Math.min(g.goal,g.saved+a);g.feed.unshift({ts:now()-rnd(1,8)*36e5,t:`${BOTS[m.id][0]} aportó ${M(a)} al objetivo`});notify(`${BOTS[m.id][0]} aportó ${M(a)} a ${g.name}`)}
  g.streak=any?(g.streak||0)+1:0});
 ST.pauses.filter(p=>p.status==='wait'&&now()>=p.until&&!p.told).forEach(p=>{p.told=true;notify(`Pasaron 24 h: ¿todavía querés ${p.item}? Decidí y ganá +50 si no la comprás.`)});
 const c=ST.ch;if(c&&today()>c.end){const p=chProgress();if(c.status==='on'){if(p&&!p.fail&&c.type!=='reg5'){c.status='won';earn(c.pts,'Desafío cumplido',c.t,'target');notify(`¡Cumpliste el desafío “${c.t}”! +${c.pts}`)}else{c.status='lost';notify(`No llegaste con el desafío “${c.t}”. ¡Hay uno nuevo!`)}}ST.ch=newChallenge(c.i+1,today())}
 const s=streakInfo();if(!s.todayDone&&s.n>0)notify(`Tu racha de ${s.n} días sigue viva: registrá hoy para no perderla.`);
 toast(`Demo: pasó un día. Hoy es ${fmtDay(now()).toLowerCase()}.`);
}

S.ob3=()=>{const q=(ST.form.q||'').toLowerCase();return`<div class="body" style="display:flex;flex-direction:column">

/* ---------- inicio ---------- */
const BAL=()=>`<div data-go="detail" style="border-radius:24px;padding:18px 20px 16px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;position:relative;overflow:hidden">

 <div style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Tenés</div>
 <div class="row" style="gap:10px;margin-top:4px"><span class="pts" style="font-size:58px;line-height:1">${N(ST.pts)}</span><span class="logo" style="color:#fff;font-size:22px;margin-top:14px">PE<span style="color:var(--gold)">$</span>ITO<span style="color:var(--gold)">$</span></span></div>
 <div class="row" style="margin-top:10px;font-size:13px"><span style="background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-weight:700">+${N(weekPts())} esta semana</span><span class="sp"></span><span style="font-weight:700">Ver detalle</span>${I('chev',16)}</div>

const expRow=(e,del)=>`<div class="li"><span class="ibox">${I(catIco(e.cat),19)}</span><div style="flex:1;min-width:0"><div class="tt" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.note||e.cat)}</div><div class="small" style="font-size:12px">${e.cat} · ${ago(e.ts)}</div></div><b class="pts" style="font-size:16px">−${M(e.amt)}</b>${del?`<span class="x" data-act="delexp" data-id="${e.id}">${I('x',16)}</span>`:''}</div>`;
const pauseLeft=p=>{const ms=p.until-now();if(ms<=0)return null;const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?`quedan ${h} h ${m} min`:`quedan ${m} min`};
const pauseRow=p=>{const l=pauseLeft(p);return`<div class="card row" data-hl="pausewin" style="gap:12px;padding:10px 14px;margin-top:8px">${I('bag',18,'color:var(--ink2)')}<div style="flex:1;font-size:13.5px"><b>${esc(p.item)}</b> · ${M(p.amt)}<div class="small" style="font-size:11.5px">${l?`Te avisamos ${fmtShort(p.until)} a las ${fmtHour(p.until)}`:'¡Ya pasaron las 24 h!'}</div></div>${l?`<span style="font-size:12px;font-weight:700;color:var(--gold-d);text-align:right">${l}</span>`:`<span class="chip on" data-act="decide" data-id="${p.id}">Decidir</span>`}</div>`};
S.home=()=>{const u=ST.user,sp=spentMonth(),pct=Math.min(100,sp/u.budget*100),s=streakInfo(),c=ST.ch,cp=chProgress(),unread=ST.notifs.filter(n=>!n.read).length,pend=ST.pauses.filter(p=>p.status==='wait');
 const left=u.budget-sp,ok=pct<=new Date(now()).getDate()/daysInMonth(now())*100+5;
 return`<div class="body">

 ${BAL()}
 <div class="row" style="gap:8px;margin-top:12px">
  <div class="qa" data-go="add" data-hl="add-qa"><span class="ibox">${I('pen',20)}</span>Registrar gasto</div>

  <div class="qa" data-act="nospend"><span class="ibox" style="${ST.nospend.includes(today())?'background:var(--green-l);color:var(--green)':''}">${I(ST.nospend.includes(today())?'check':'sun',20)}</span>Hoy no gasté</div>
 </div>
 ${u.logMode==='mail'?`<div class="card row" data-act="sync" style="gap:10px;margin-top:10px;padding:11px 14px">${I('mail',19,'color:var(--brand)')}<div style="flex:1;font-size:13.5px"><b>Avisos del banco</b><div class="small" style="font-size:11.5px">${ST.lastSync?'Última sincronización '+ago(ST.lastSync):'Traé tus compras con tarjeta'}</div></div><span class="chip">Sincronizar</span></div>`:''}
 <div class="card" style="margin-top:10px" data-go="report"><div class="row"><span class="lbl">Presupuesto de ${monthName()}</span><span class="sp"></span><span style="font-weight:700;font-size:13px;color:${left<0?'var(--red)':ok?'var(--green)':'var(--gold-d)'}">${left<0?'Te pasaste':ok?'Vas bien':'Ojo'}</span></div>
  <div class="row" style="margin:6px 0 8px;font-size:14px"><b class="pts" style="font-size:19px">${M(sp)}</b>&nbsp;gastados de ${M(u.budget)}</div><div class="bar"><i style="width:${pct}%;${left<0?'background:var(--red)':''}"></i></div>
  <div class="small" style="margin-top:7px;font-size:12px">${left>=0?`Te quedan ${M(left)} · ≈ ${M(perDay())} por día hasta fin de mes`:`Te pasaste ${M(-left)} este mes`}</div></div>
 <div class="row" style="gap:8px;margin-top:10px">
  <div class="card" data-go="streaks" data-hl="streak" style="flex:1;padding:11px 12px"><div class="row" style="gap:6px;color:var(--brand)">${I('flame',18)}<b class="pts" style="font-size:19px;color:var(--ink)">${s.n} ${s.n===1?'día':'días'}</b></div><div class="small" style="font-size:11.5px">${s.todayDone?'de racha · hoy ✓':s.n?'¡registrá hoy para seguir!':'empezá tu racha hoy'}</div></div>
  <div class="card" data-go="streaks" style="flex:1;padding:11px 12px"><div class="row" style="gap:6px;color:var(--brand)">${I('target',18)}<b class="pts" style="font-size:19px;color:var(--ink)">${c.status==='won'?'✓':'+'+c.pts}</b><span class="sp"></span><span style="font-size:10.5px;font-weight:700;color:var(--ink2)">día ${cp.day}/7</span></div><div class="small" style="font-size:11.5px">${c.t}${c.status==='won'?' · ¡cumplido!':cp.fail?' · perdido':''}</div></div>
 </div>
 ${pend.length?`<div class="row" style="margin:14px 0 0"><span class="t2">En pausa</span><span class="sp"></span><span class="small" style="font-weight:700;color:var(--brand)" data-go="impulse">Ver</span></div>${pend.map(pauseRow).join('')}`:''}
 <div class="row" style="margin:14px 0 2px"><span class="t2">Grupos</span><span class="sp"></span><span class="small" style="font-weight:700;color:var(--brand)" data-go="groups">Ver todos</span></div>

 <div class="row" style="margin:14px 0 2px"><span class="t2">Últimos gastos</span><span class="sp"></span><span class="small" style="font-weight:700;color:var(--brand)" data-go="moves">Ver todos</span></div>
 ${ST.expenses.slice(0,3).map(e=>expRow(e)).join('')||'<div class="empty">Todavía no registraste gastos. Tocá el + para empezar.</div>'}
</div>`};

 <div class="lbl" style="margin:16px 0 8px">Categoría</div>

 <div style="margin-top:auto;padding-top:18px">
  ${first?`<div class="row small" style="gap:8px;margin-bottom:10px;font-size:12.5px;color:var(--ink)">${I('flame',17,'color:var(--brand)')}<span>${s.n?`Registrando hoy llegás a <b>${s.n+(s.todayDone?0:1)} días de racha</b>`:'Registrando hoy empezás tu racha'}</span></div>`:''}
  <div class="btn" data-act="addexp" data-hl="add">Registrar ${first&&String(f.day||'0')==='0'?`· ganá <span class="pts">+10</span>${COIN(18)}`:''}</div>

 <div class="card row" style="gap:10px;padding:12px 14px"><div style="flex:1"><div class="lbl">Este mes</div><div class="pts" style="font-size:22px">${M(spentMonth())}</div></div><div style="text-align:right"><div class="lbl">Gastos</div><div class="pts" style="font-size:22px">${monthExp().length}</div></div></div>

S.save=()=>{const f=ST.form,dest=f.dest??(ST.groups.find(g=>g.goal)?.id||'me'),g=saveGoal(),sm=savedMonth();return`<div class="body" style="display:flex;flex-direction:column">

  <div class="row"><div><div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Disponibles</div><div class="pts" style="font-size:46px;line-height:1.05">${N(ST.pts)}</div></div><span class="sp"></span><div style="text-align:right"><div style="font-size:12px;opacity:.85">Ganados en ${monthName()}</div><div class="pts" style="font-size:24px">+${N(monthPts())}</div></div></div></div>

 return`<div class="body">${back('home','Tus rachas')}
 <div data-hl="streak" style="border-radius:24px;padding:18px 20px;background:var(--ink);color:#fff;position:relative;overflow:hidden">${STAR(250,-14,80,10,'rgba(255,255,255,.08)')}
  <div class="row" style="gap:10px">${I('flame',34,'color:var(--gold)')}<div><div class="pts" style="font-size:40px;line-height:1">${s.n} ${s.n===1?'día':'días'}</div><div style="font-size:13px;opacity:.8">registrando tus gastos · récord ${Math.max(ST.best||0,s.n)}</div></div></div>

  ${!s.todayDone?`<div class="btn" data-go="add" style="margin-top:14px;height:42px;background:var(--gold);color:var(--ink)">Registrar hoy y sumar un día</div>`:''}</div>

 <div class="lbl" style="margin:16px 0 8px">Más rachas</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
  ${sc('target',budgetStreak(),'Días en presupuesto','sin pasarte del gasto diario','var(--green)')}

  ${ST.groups.slice(0,2).map(g=>sc('users',g.streak||0,'Racha de '+esc(g.name),'días seguidos sumando en grupo','var(--brand)')).join('')}

 <div class="lbl" style="margin:16px 0 8px">Desafío de la semana</div>
 <div class="card"><div class="row" style="gap:10px">${I('target',20,'color:var(--brand)')}<div style="flex:1"><div style="font-weight:700;font-size:14.5px">${c.t}</div><div class="small" style="font-size:12px">${c.s} · ${cp.txt}</div></div><b class="plus">+${c.pts}</b></div>
  <div class="bar" style="margin-top:10px"><i style="width:${cp.day/7*100}%;${cp.fail?'background:#ccc':''}"></i></div>
  <div class="small" style="font-size:11.5px;margin-top:6px">${c.status==='won'?'¡Cumplido! Ya sumaste los pe$itos.':cp.fail?'Esta vez no salió. La semana que viene hay otro.':`Día ${cp.day} de 7 · termina el ${fmtShort(kDate(c.end))}`}</div></div>

 <div class="row" style="gap:6px">${MILESTONES.map(([m,p])=>`<div style="flex:1;text-align:center;opacity:${s.n>=m?1:.4}"><div style="width:46px;height:46px;margin:0 auto;border-radius:50%;background:${s.n>=m?'var(--brand)':'#fff'};border:2px solid var(--brand);color:${s.n>=m?'#fff':'var(--brand)'};display:flex;align-items:center;justify-content:center" class="pts">${m}</div><div style="font-size:11px;font-weight:700;margin-top:4px">+${p}</div></div>`).join('')}</div>
</div>`};

 return`<div class="row" style="gap:10px;font-size:13.5px">${I('chart',18,'color:var(--brand)')}<span>Sería tu <b>${n}º gasto en ${cat}</b> este mes</span></div>
  <div class="row" style="gap:10px;font-size:13.5px;margin-top:9px">${I('piggy',18,'color:var(--brand)')}<span>Llegarías al <b style="color:${pct>100?'var(--red)':'inherit'}">${pct}%</b> del presupuesto${amt&&days?` · <b>${String(days).replace('.',',')} días</b> de tu gasto diario`:''}</span></div>
  <div class="bar" style="margin-top:9px;background:#fff"><i style="width:${Math.min(100,pct)}%;${pct>100?'background:var(--red)':''}"></i></div>`}
S.impulse=()=>{const f=ST.form,cat=f.cat2||'Ropa',pend=ST.pauses.filter(p=>p.status==='wait'),hist=ST.pauses.filter(p=>p.status!=='wait').slice(0,4);return`<div class="body" style="display:flex;flex-direction:column">
 ${back('home','<span class="lbl" style="color:var(--brand)">Pausa de 24 h</span>')}
 <div class="t1" style="font-size:30px">¿Lo compro?</div>
 <div class="small" style="font-size:13.5px;margin-top:4px;line-height:1.4">Antes de comprar algo que no tenías planeado, anotalo acá.</div>
 <div class="lbl" style="margin:16px 0 6px">¿Qué querés comprar?</div>
 <div class="inp" style="height:46px">${I('bag',18)}<input id="i-item" placeholder="Ej: campera de jean" value="${esc(f.item||'')}"></div>
 <div class="row" style="gap:8px;margin-top:8px"><div class="inp" style="height:46px;width:130px">$<input id="i-amt" inputmode="numeric" placeholder="0" value="${esc(f.amt||'')}" data-live="insight"></div>
  <div class="chips" style="flex:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none">${['Ropa','Salidas','Delivery','Otro'].map(c=>`<span class="chip ${cat===c?'on':''}" data-act="icat" data-v="${c}">${c}</span>`).join('')}</div></div>
 <div class="card" id="insight" style="margin-top:12px;background:var(--blush);border:none;padding:13px 15px">${impulseInsight()}</div>
 <div class="row" style="gap:10px;margin-top:12px;font-size:13px;color:var(--ink2)">${I('clock',18,'color:var(--brand)')}<span>Te avisamos <b style="color:var(--ink)">${fmtShort(now()+DAY)} a las ${fmtHour(now()+DAY)}</b> para ver si todavía lo querés.</span></div>
 <div style="margin-top:16px">
  <div class="btn" data-act="wait" data-hl="pause">Esperar 24 h · ganá <span class="pts">+50</span>${COIN(18)}</div>
  <div data-act="buynow" style="text-align:center;margin-top:12px;font-weight:700;font-size:14px;color:var(--ink2)">Lo necesito, comprar igual</div>
 </div>
 ${pend.length?`<div class="lbl" style="margin:20px 0 0">En pausa</div>${pend.map(pauseRow).join('')}`:''}
 ${hist.length?`<div class="lbl" style="margin:18px 0 4px">Decisiones anteriores</div>${hist.map(p=>`<div class="li">${I(p.status==='won'?'check':'bag',18,`color:${p.status==='won'?'var(--green)':'var(--ink2)'}`)}<div style="flex:1;font-size:13.5px"><b>${esc(p.item)}</b> · ${M(p.amt)}</div><span class="small" style="font-weight:700;color:${p.status==='won'?'var(--green)':'var(--ink2)'}">${p.status==='won'?'No la compraste · +50':'La compraste'}</span></div>`).join('')}`:''}
</div>`};

/* ---------- canjes ---------- */
const rewRow=r=>{const ok=r.p<=ST.pts,pct=Math.min(100,Math.round(ST.pts/r.p*100));return`<div ${ok?`data-act="askredeem" data-id="${r.id}"`:''} class="li"><span class="ibox" style="width:46px;height:46px;border-radius:14px">${I(r.ic,22)}</span><div style="flex:1"><div class="tt">${r.t}</div><div class="small" style="font-size:12px">${r.s}</div>${ok?'':`<div class="bar" style="height:5px;margin-top:6px;width:120px"><i style="width:${pct}%;background:var(--gold)"></i></div>`}</div><div style="text-align:right"><div class="row" style="gap:4px;justify-content:flex-end"><b class="pts" style="font-size:17px">${r.p}</b>${COIN(15)}</div><div style="font-size:11px;font-weight:700;color:${ok?'var(--green)':'var(--gold-d)'}">${ok?'Canjear':'Te faltan '+(r.p-ST.pts)}</div></div></div>`};
const gRewRow=(r,g)=>{const ok=r.p<=g.pool;return`<div ${ok?`data-act="askgredeem" data-id="${r.id}" data-g="${g.id}"`:''} data-hl="g-${r.id}" class="li"><span class="ibox" style="width:46px;height:46px;border-radius:14px;background:var(--ink);color:var(--gold)">${I(r.ic,22)}</span><div style="flex:1"><div class="tt">${r.t} ${g.members.length}</div><div class="small" style="font-size:12px">${r.s}</div>${ok?'':`<div class="bar" style="height:5px;margin-top:6px;width:120px"><i style="width:${Math.min(100,g.pool/r.p*100)}%;background:var(--gold)"></i></div>`}</div><div style="text-align:right"><div class="row" style="gap:4px;justify-content:flex-end"><b class="pts" style="font-size:17px">${r.p}</b>${COIN(15)}</div><div style="font-size:11px;font-weight:700;color:${ok?'var(--green)':'var(--gold-d)'}">${ok?'Canjear en grupo':'Faltan '+(r.p-g.pool)}</div></div></div>`};
S.rewards=()=>{const cat=ST.cat,feat=REWARDS.find(r=>r.feat);const gsel=grp(ST.gid)||ST.groups[0];return`<div class="body">
 <div class="row" style="margin:4px 0 14px"><span class="t1">Canjes</span><span class="sp"></span><span class="chip" data-go="myredeems" style="height:34px;gap:6px">Mis canjes</span><span class="chip" style="height:34px;gap:6px;border-color:var(--gold);background:#FFF6E0;margin-left:6px">${COIN(17)}<b class="pts" style="font-size:16px">${N(ST.pts)}</b></span></div>
 <div style="display:flex;gap:7px">${[['Comida','coffee'],['Moda','shirt'],['Viajes','plane'],['Experiencias','ticket'],['Grupos','users']].map(([t,ic])=>`<div data-act="rcat" data-v="${t}" style="flex:1;text-align:center"><div style="height:58px;border-radius:17px;background:${cat===t?'var(--brand)':'#fff'};color:${cat===t?'#fff':'var(--brand)'};border:1.5px solid ${cat===t?'var(--brand)':'var(--line)'};display:flex;align-items:center;justify-content:center">${I(ic,25)}</div><div style="font-size:11px;font-weight:700;margin-top:6px">${t==='Experiencias'?'Experien.':t}</div></div>`).join('')}</div>
 ${cat==='Grupos'?(gsel?`
  <div style="margin-top:16px;border-radius:22px;background:var(--ink);color:#fff;padding:16px 18px;position:relative;overflow:hidden">${STAR(250,-14,80,10,'rgba(255,255,255,.08)')}
   <div class="lbl" style="color:var(--gold)">Pozo del grupo</div>
   <div class="row" style="gap:8px;margin-top:6px"><b class="pts" style="font-size:32px">${N(gsel.pool)}</b>${COIN(20)}<span class="sp"></span><span style="font-size:12.5px;opacity:.75;text-align:right">Todo lo que suman<br>los ${gsel.members.length} va al pozo</span></div></div>
  ${ST.groups.length>1?`<div class="chips" style="margin-top:12px">${ST.groups.map(g=>`<span class="chip ${g.id===gsel.id?'on':''}" data-act="rgsel" data-v="${g.id}">${esc(g.name)}</span>`).join('')}</div>`:''}
  <div class="lbl" style="margin:16px 0 2px">Canjes para todo el grupo</div>${GREWARDS.map(r=>gRewRow(r,gsel)).join('')}`:`<div class="empty">Sumate a un grupo para desbloquear canjes grupales.<div class="btn" data-go="newgroup" style="margin-top:12px">Crear grupo</div></div>`):`
 ${cat==='Comida'?`<div style="margin-top:16px;border-radius:22px;background:var(--ink);color:#fff;padding:16px 18px;position:relative;overflow:hidden">${STAR(250,-14,80,10,'rgba(255,255,255,.08)')}
  <div class="lbl" style="color:var(--gold)">Destacado de la semana</div>
  <div class="row" style="gap:14px;margin-top:10px"><span style="width:58px;height:58px;border-radius:18px;background:var(--gold);color:#5a3a00;display:flex;align-items:center;justify-content:center;flex:none">${I('coffee',30)}</span><div style="flex:1"><div class="t2" style="font-size:18px">${feat.t}</div><div style="font-size:12.5px;opacity:.75">${feat.s}</div></div></div>
  <div class="row" style="margin-top:14px"><div class="row" style="gap:6px"><b class="pts" style="font-size:24px">${feat.p}</b>${COIN(18)}</div><span class="sp"></span><span ${feat.p<=ST.pts?`data-act="askredeem" data-id="${feat.id}"`:''} data-hl="redeem" style="background:${feat.p<=ST.pts?'#fff':'rgba(255,255,255,.2)'};color:${feat.p<=ST.pts?'var(--ink)':'#fff'};font-weight:700;font-size:14px;padding:9px 18px;border-radius:14px">${feat.p<=ST.pts?'Canjear':'Te faltan '+(feat.p-ST.pts)}</span></div></div>`:''}
 <div class="lbl" style="margin:16px 0 2px">${cat}</div>
 ${REWARDS.filter(r=>r.cat===cat&&!r.feat).map(rewRow).join('')}`}
</div>`};
function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:5,margin:0,scalable:true})}catch(e){return `<div style="width:168px;height:168px;display:flex;align-items:center;justify-content:center;background:var(--blush);border-radius:12px" class="pts">${esc(text)}</div>`}}
S.redeem=()=>{const r=ST.redeems.find(x=>x.id===ST.rid)||ST.redeems[0];return`<div class="body" style="display:flex;flex-direction:column;align-items:center;text-align:center">
 ${STAR(30,30,30,-12,'var(--gold)')}${STAR(290,70,40,14)}${STAR(270,20,18,0,'var(--brand-l)')}
 <div style="margin-top:30px;width:70px;height:70px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center">${I('check',38,'stroke-width:2.6')}</div>

 <div class="card" style="margin-top:18px;padding:18px;border-radius:24px;box-shadow:0 14px 30px -18px rgba(124,10,41,.35)"><div style="width:168px;height:168px;margin:0 auto">${qrSvg('PESITOS|'+r.code+'|'+r.name)}</div>
  <div class="pts" style="font-size:22px;letter-spacing:.12em;margin-top:10px">${r.code}</div><div class="small" style="font-size:12px">Mostralo en caja · vence el ${fmtShort(r.exp)}</div></div>
 <div class="row" style="gap:8px;margin-top:14px;font-size:14px"><span>${r.group?'Quedan en el pozo':'Te quedan'}</span><b class="pts" style="font-size:18px">${N(r.group?(grp(r.group)?.pool||0):ST.pts)}</b>${COIN(16)}</div>
 <div style="width:100%;margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px">${r.group?`<div class="btn" data-act="opengroup" data-id="${r.group}">Volver al grupo</div>`:`<div class="btn" data-act="share" data-id="${r.id}">${I('share',18)}Compartir con el grupo</div>`}<div data-go="rewards" style="font-weight:700;font-size:14px;color:var(--ink2);padding:6px">Volver a canjes</div></div>
</div>`};

 ${ST.redeems.map(r=>`<div class="li" data-act="openredeem" data-id="${r.id}"><span class="ibox" style="${r.group?'background:var(--ink);color:var(--gold)':''}">${I(r.group?'users':'gift',19)}</span><div style="flex:1"><div class="tt">${esc(r.name)}</div><div class="small" style="font-size:12px">${esc(r.place)} · ${r.code}</div></div><div style="text-align:right"><div class="minus">−${r.cost}</div><div style="font-size:11px;font-weight:700;color:${r.used||r.exp<now()?'var(--ink2)':'var(--green)'}">${r.used?'Usado':r.exp<now()?'Vencido':'Vigente'}</div></div></div>`).join('')||'<div class="empty">Todavía no canjeaste nada</div>'}</div>`;

  <div class="row" style="gap:10px"><span class="ibox" style="background:var(--brand);color:#fff">${I('plus',20)}</span><div style="flex:1"><div class="t2">Crear un grupo</div><div class="small" style="font-size:12px">Con un objetivo en común o para competir</div></div></div>

 <div class="lbl" style="margin:14px 0 6px">Fecha límite</div><div class="inp">${I('cal',18)}<input id="g-date" type="date" value="${esc(f.gdate||kAdd(today(),60))}"></div>

 ${ST.friends.map(x=>`<div class="row" data-act="gmem" data-id="${x.id}" style="gap:12px;padding:8px 0"><span class="av" style="background:${BOTS[x.id][2]}">${BOTS[x.id][1]}</span><div style="flex:1;font-weight:700;font-size:14.5px">${x.n}</div><span class="radio ${sel.includes(x.id)?'on':''}" style="border-radius:6px"></span></div>`).join('')}

S.group=()=>{const g=grp(ST.gid);if(!g){ST.screen='groups';return S.groups()}const ms=members(g),tab=ST.gtab;return`<div class="body">

  <div class="row" style="margin-top:6px"><b class="pts" style="font-size:28px">${M(g.saved)}</b><span style="opacity:.7;font-size:13px;margin:8px 0 0 6px">de ${M(g.goal)}</span></div>

 :`<div class="card" style="background:var(--ink);color:#fff;border:none;padding:16px 18px"><div class="row"><div class="lbl" style="color:var(--gold)">Grupo para competir</div><span class="sp"></span><span style="font-size:12px;font-weight:700;color:var(--gold)">${I('flame',13)} ${g.streak} días de racha</span></div><div style="margin-top:8px;font-size:14px">Ganá el mes y llevate <b>+30 pe$itos</b> extra.</div></div>`}
 <div class="row card" style="gap:10px;margin-top:10px;padding:11px 14px" data-act="gtab" data-v="rewards">${COIN(20)}<div style="flex:1;font-size:13.5px"><b>${N(g.pool)} en el pozo del grupo</b><div class="small" style="font-size:11.5px">Para canjes grupales</div></div>${I('chev',16)}</div>

 ${tab==='rank'?`<div style="margin-top:8px" data-hl="group">${ms.map((m,i)=>`<div class="row" style="gap:12px;padding:9px 12px;border-radius:14px;${m.me?'background:var(--blush);':''}"><b class="pts" style="width:18px;font-size:17px;color:${i===0?'var(--gold-d)':'var(--ink2)'}">${i+1}</b><span class="av" style="background:${m.c};width:34px;height:34px;font-size:13px">${esc(m.ini)}</span><div style="flex:1;font-weight:700;font-size:14.5px">${esc(m.n)}${m.me?' <span class="small" style="font-weight:500">(vos)</span>':''}</div><b class="pts" style="font-size:16px">${N(m.pts)}</b>${COIN(14)}</div>`).join('')}</div>

 ['flame','Racha de 7','var(--brand)',best>=7],['target','Presupuesto','var(--green)',budgetStreak()>=3],['clock','Anti-impulso','var(--gold-d)',ST.pauses.some(p=>p.status==='won')],

const cfg=(ic,t,v,go)=>`<div class="li" ${go}>${I(ic,19,'color:var(--brand)')}<span style="font-size:14px;flex:1">${t}</span><span class="small" style="font-size:12.5px">${v}</span>${I('chev',15,'color:#bba')}</div>`;
S.profile=()=>{const u=ST.user,s=streakInfo(),b=badges();return`<div class="body">
 <div class="row" style="gap:14px;margin:6px 0 16px"><span class="av" style="width:62px;height:62px;font-size:22px;background:var(--brand)">${esc(initials(u.name))}</span><div><div class="t1" style="font-size:22px">${esc(u.name)}</div><div class="small">${u.age?u.age+' años · ':''}${esc((u.tags||[]).join(' y ')||'Pe$itos')}</div></div></div>

   if(g){g.saved=Math.min(g.goal,g.saved+amt);g.feed.unshift({ts:now(),t:`${meName()} aportó ${M(amt)} al objetivo`})}
   if(!goalBefore&&savedMonth()>=saveGoal()&&saveGoal()>0&&!ST.closed['sg-'+monthName()]){ST.closed['sg-'+monthName()]=1;earn(50,`Ahorraste el ${ST.user.savePct}% del mes`,'Meta de ahorro cumplida','trophy');celebrateQ.push({title:'¡Meta de ahorro cumplida!',sub:`Llegaste a ${M(saveGoal())} este mes.`,pts:50})}
   ST.done.save=1;ST.form={};if(g){ST.gid=g.id;ST.gtab='rank';ST.screen='group'}else ST.screen='home';
   afterGain(g?`Aportaste ${M(amt)} a ${g.name} · +${p} pe$itos`:`Guardaste ${M(amt)} · +${p} pe$itos`);render();return}
  case 'icat':ST.form.cat2=d.v;render(false);return;
  case 'wait':{const item=val('i-item').trim(),amt=num('i-amt');if(!item||!amt){toast('Contanos qué querés comprar y cuánto sale');render(false);return}
   ST.pauses.unshift({id:uid(),item,amt,cat:ST.form.cat2||'Ropa',ts:now(),until:now()+DAY,status:'wait'});notify(`Pusiste en pausa: ${item} (${M(amt)}). Te avisamos en 24 h.`);ST.done.pause=1;ST.form={};
   toast('En pausa. Te avisamos en 24 h · en la demo usá “Adelantar 24 h”');render(false);return}
  case 'buynow':{const item=val('i-item').trim(),amt=num('i-amt');if(!amt){toast('Poné cuánto sale');render(false);return}addExpense(amt,ST.form.cat2||'Ropa',item||'Compra');ST.form={};ST.screen='home';afterGain(`Compra registrada · ${M(amt)}`);render();return}
  case 'decide':ST.sheet={type:'decide',id:d.id};render(false);return;
  case 'pwin':{const p=ST.pauses.find(x=>x.id===d.id);p.status='won';earn(50,'Evitaste una compra impulsiva',`No compraste ${p.item}`,'clock');ST.groups.forEach(g=>g.feed.unshift({ts:now(),t:`${meName()} evitó una compra impulsiva`}));ST.done.pausewin=1;ST.sheet={type:'celebrate',title:'¡Le ganaste al impulso!',sub:`Te ahorraste ${M(p.amt)} en ${p.item}.`,pts:50};render(false);return}
  case 'pbuy':{const p=ST.pauses.find(x=>x.id===d.id);p.status='bought';ST.sheet=null;addExpense(p.amt,['Ropa','Salidas','Delivery'].includes(p.cat)?p.cat:'Otro',p.item);afterGain(`Compra registrada · ${M(p.amt)}. ¡Al menos lo pensaste!`);render(false);return}
  case 'rcat':ST.cat=d.v;render(false);return;
  case 'rgsel':ST.gid=d.v;render(false);return;
  case 'askredeem':{const r=REWARDS.find(x=>x.id===d.id);ST.sheet={type:'confirm',title:`¿Canjear ${r.t}?`,sub:`${r.s}. Se descuentan ${r.p} pe$itos y te quedan ${ST.pts-r.p}.`,ok:'Canjear',act:'redeem',attrs:`data-id="${r.id}"`};render(false);return}
  case 'redeem':{const r=REWARDS.find(x=>x.id===d.id);if(ST.pts<r.p)return;earn(-r.p,`Canjeaste ${r.t}`,r.s,'gift');const rd={id:uid(),ts:now(),name:r.t,place:r.s.split(' · ')[0],cost:r.p,code:'PES-'+rnd(1000,9999),exp:now()+7*DAY,group:null};ST.redeems.unshift(rd);ST.rid=rd.id;ST.sheet=null;ST.done.redeem=1;go('redeem');return}
  case 'askgredeem':{const r=GREWARDS.find(x=>x.id===d.id),g=grp(d.g);ST.sheet={type:'confirm',title:`¿Canjear ${r.t.toLowerCase()} ${g.members.length}?`,sub:`Lo paga el pozo de “${esc(g.name)}”: se descuentan ${r.p} y quedan ${g.pool-r.p}. Le avisamos a todo el grupo.`,ok:'Canjear para el grupo',act:'gredeem',attrs:`data-id="${r.id}" data-g="${g.id}"`};render(false);return}
  case 'gredeem':{const r=GREWARDS.find(x=>x.id===d.id),g=grp(d.g);if(g.pool<r.p)return;g.pool-=r.p;const name=`${r.t} ${g.members.length}`;const rd={id:uid(),ts:now(),name,place:r.s.split(' · ')[0],cost:r.p,code:'GRP-'+rnd(1000,9999),exp:now()+14*DAY,group:g.id};ST.redeems.unshift(rd);ST.rid=rd.id;g.feed.unshift({ts:now(),t:`${meName()} canjeó ${name.toLowerCase()} con el pozo`});notify(`El grupo ${g.name} canjeó ${name.toLowerCase()}`);ST.sheet=null;ST.done['g-mer']=1;go('redeem');return}
  case 'openredeem':ST.rid=d.id;go('redeem');return;
  case 'share':{const r=ST.redeems.find(x=>x.id===d.id);ST.groups.forEach(g=>g.feed.unshift({ts:now(),t:`${meName()} canjeó ${r.name}`}));if(ST.groups[0]){ST.gid=ST.groups[0].id;ST.gtab='feed';ST.screen='group'}toast(ST.groups.length?`Lo compartiste en ${ST.groups.map(g=>g.name).join(' y ')}`:'Sumate a un grupo para compartir');render();return}
  case 'opengroup':ST.gid=d.id;ST.gtab='rank';if(d.id===((ST.groups[0]||{}).id))ST.done.group=1;ST.sheet=null;go('group');return;
  case 'gtab':ST.gtab=d.v;if(d.v==='rank')ST.done.group=1;render(false);return;
  case 'gsave':ST.form={dest:d.id};go('save');return;
  case 'invite':{const link=location.origin+location.pathname+'#g='+d.id;try{navigator.clipboard.writeText(link)}catch(err){}toast('Link de invitación copiado');render(false);return}
  case 'leave':ST.sheet={type:'confirm',title:'¿Salir del grupo?',sub:'Dejás de sumar al pozo y al ranking de este grupo.',ok:'Salir',act:'doleave',attrs:`data-id="${d.id}"`};render(false);return;
  case 'doleave':ST.groups=ST.groups.filter(x=>x.id!==d.id);ST.sheet=null;go('groups');return;
  case 'gmem':{const f=ST.form;f.gname=val('g-name');f.ggoal=val('g-goal');f.gdate=val('g-date');f.mem=f.mem||ST.friends.filter(x=>x.follow).map(x=>x.id);f.mem=f.mem.includes(d.id)?f.mem.filter(x=>x!==d.id):[...f.mem,d.id];render(false);return}
  case 'mkgroup':{const n=val('g-name').trim();if(!n){toast('Ponele un nombre al grupo');render(false);return}const mem=ST.form.mem||ST.friends.filter(x=>x.follow).map(x=>x.id);const g=mkGroup(n,num('g-goal'),val('g-date'),['me',...mem]);g.members.forEach(m=>{if(m.id!=='me')m.pts=rnd(0,40)});g.pool=g.members.reduce((s,m)=>s+(m.pts||0),0);ST.groups.push(g);ST.gid=g.id;ST.gtab='rank';ST.form={};
   try{navigator.clipboard.writeText(location.origin+location.pathname+'#g='+g.id)}catch(err){}toast(`Creaste “${n}” · link de invitación copiado`);go('group');return}
  case 'advance':advanceDay();render(false);return;
  case 'askreset':ST.sheet={type:'confirm',title:'¿Reiniciar la demo?',sub:'Volvés a Sofi con los datos de ejemplo. Se borra lo que hiciste.',ok:'Reiniciar',act:'doreset'};render(false);return;
  case 'doreset':seedDemo();toast('Demo reiniciada');render();return;
  case 'logout':ST.sheet={type:'confirm',title:'¿Cerrar sesión?',sub:'Se borran tus datos de este dispositivo.',ok:'Cerrar sesión',act:'dologout'};render(false);return;
  case 'dologout':ST=blank();render();return;
  case 'clog':ST.user.logMode=d.v;render(false);return;
  case 'crep':ST.user.reports=d.v;render(false);return;
  case 'savecfg':{const u=ST.user;u.budget=num('c-bud')||u.budget;u.savePct=+val('c-pct');u.income=num('c-inc');toast('Metas actualizadas');go('profile');return}
  case 'closesheet':ST.sheet=null;if(celebrateQ.length){afterGain('')}render(false);return;
  }
  return}
 if(g){const s=g.dataset.go;if(s==='report')ST.done.report=1;if(s==='streaks')ST.done.streak=1;if(s==='notifs')setTimeout(()=>{ST.notifs.forEach(n=>n.read=true);save()},0);if(ST.screen==='ob1'&&s==='ob2')obCapture();ST.hl='';go(s);return}
});

/* ---------- arranque ---------- */
ST=load()||blank();
if(ST.logged&&ST.screen==='login')ST.screen='home';
if(!ST.logged&&!['login','ob1','ob2','ob3'].includes(ST.screen))ST.screen='login';
render();
setInterval(()=>{const a=document.activeElement;if(a&&a.tagName==='INPUT')return;if(ST.logged&&['home','impulse'].includes(ST.screen)&&!ST.sheet)render(false)},30000);
</script></body></html>
